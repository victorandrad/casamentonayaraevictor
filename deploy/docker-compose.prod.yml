# Production stack on the VPS (used by .github/workflows/deploy.yml).
#   docker compose -f docker-compose.prod.yml --env-file .env --env-file imagens.env up -d
# .env holds the secrets (see deploy/.env.production.example); imagens.env is
# written by the deploy with the image tags being released.
name: casamento-nv

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-casamento}
      POSTGRES_USER: ${POSTGRES_USER:-casamento}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    image: ${API_IMAGE:?defina API_IMAGE}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4100
      DATABASE_URL: postgres://${POSTGRES_USER:-casamento}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-casamento}
      ALLOWED_ORIGINS: https://${SITE_DOMAIN:?defina SITE_DOMAIN no .env}
      COOKIE_SECURE: "true"
      SITE_URL: https://${SITE_DOMAIN}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_NOME: ${ADMIN_NOME:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:?defina STRIPE_SECRET_KEY no .env}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:?defina STRIPE_WEBHOOK_SECRET no .env}
      SMTP_HOST: ${SMTP_HOST:?defina SMTP_HOST no .env}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      EMAIL_FROM: ${EMAIL_FROM:?defina EMAIL_FROM no .env}
      EMAIL_REPLY_TO: ${EMAIL_REPLY_TO:-}
    volumes:
      - uploads-data:/app/uploads
    depends_on:
      db:
        condition: service_healthy

  web:
    image: ${WEB_IMAGE:?defina WEB_IMAGE}
    restart: unless-stopped
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:?defina ACME_EMAIL no .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - api

volumes:
  db-data:
  uploads-data:
  caddy-data:
  caddy-config:
