# Publishes https://casamentonayaraevictor.com.br on every push to main:
#   1. runs CI (typecheck + build)
#   2. builds the API and web images and pushes them to GitHub Container Registry
#   3. copies deploy/docker-compose.prod.yml to the VPS over SSH and restarts the stack
# Run it by hand (Actions → Deploy → Run workflow) to redeploy, or pass a commit
# SHA already built before to roll back to it.
#
# Repository secrets: VPS_HOST, VPS_USER, VPS_SSH_KEY, VPS_KNOWN_HOSTS
# Repository variables (optional): VPS_PORT (22), DEPLOY_PATH (/opt/casamento)
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      versao:
        description: SHA de um commit já publicado (vazio = versão atual da main)
        required: false
        default: ''

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  SITE_URL: https://casamentonayaraevictor.com.br

jobs:
  verificar:
    if: ${{ !inputs.versao }}
    uses: ./.github/workflows/ci.yml

  imagens:
    name: Imagens Docker
    needs: verificar
    if: ${{ !inputs.versao }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - name: Nome das imagens
        id: nomes
        run: echo "prefixo=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: API
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: |
            ${{ steps.nomes.outputs.prefixo }}-api:${{ github.sha }}
            ${{ steps.nomes.outputs.prefixo }}-api:latest
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Site (shell + microfrontends + Caddy)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/web.Dockerfile
          build-args: SITE_URL=${{ env.SITE_URL }}
          push: true
          tags: |
            ${{ steps.nomes.outputs.prefixo }}-web:${{ github.sha }}
            ${{ steps.nomes.outputs.prefixo }}-web:latest
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

  publicar:
    name: Publicar no servidor
    needs: imagens
    # Runs after the images, or alone when rolling back to an earlier version.
    if: ${{ always() && (needs.imagens.result == 'success' || (inputs.versao && needs.imagens.result == 'skipped')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: https://casamentonayaraevictor.com.br
    permissions:
      contents: read
      packages: read
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_PORT: ${{ vars.VPS_PORT || '22' }}
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/opt/casamento' }}
      VERSAO: ${{ inputs.versao || github.sha }}
    steps:
      # Until the VPS secrets exist, the images are still published and this job just warns.
      - name: Servidor configurado?
        id: servidor
        run: |
          if [ -z "$VPS_HOST" ] || [ -z "$VPS_USER" ]; then
            echo "::warning::Publicação pulada: cadastre os segredos VPS_HOST, VPS_USER, VPS_SSH_KEY e VPS_KNOWN_HOSTS (veja a seção Deploy do README)."
            echo "pronto=false" >> "$GITHUB_OUTPUT"
          else
            echo "pronto=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v5
        if: steps.servidor.outputs.pronto == 'true'

      - name: Chave SSH
        if: steps.servidor.outputs.pronto == 'true'
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          printf 'Host vps\n  HostName %s\n  User %s\n  Port %s\n  IdentityFile ~/.ssh/deploy\n  IdentitiesOnly yes\n' \
            "$VPS_HOST" "$VPS_USER" "$VPS_PORT" > ~/.ssh/config

      - name: Enviar docker-compose
        if: steps.servidor.outputs.pronto == 'true'
        run: |
          # shellcheck disable=SC2029 # the path is expanded here on purpose
          ssh vps "mkdir -p '$DEPLOY_PATH'"
          scp deploy/docker-compose.prod.yml "vps:$DEPLOY_PATH/docker-compose.prod.yml"

      - name: Atualizar os containers
        if: steps.servidor.outputs.pronto == 'true'
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          prefixo="ghcr.io/${GITHUB_REPOSITORY,,}"
          # Values are filled in here, in the runner; the script then runs on the server.
          # shellcheck disable=SC2087
          ssh vps bash -s <<EOF
          set -euo pipefail
          cd '$DEPLOY_PATH'
          if [ ! -f .env ]; then
            echo "::error::Falta o arquivo $DEPLOY_PATH/.env no servidor (modelo em deploy/.env.production.example)."
            exit 1
          fi
          printf 'API_IMAGE=%s\nWEB_IMAGE=%s\n' '$prefixo-api:$VERSAO' '$prefixo-web:$VERSAO' > imagens.env
          echo '$GHCR_TOKEN' | docker login ghcr.io -u '${{ github.actor }}' --password-stdin
          compose="docker compose -f docker-compose.prod.yml --env-file .env --env-file imagens.env"
          \$compose pull
          \$compose up -d --remove-orphans
          docker logout ghcr.io
          docker image prune -f
          EOF

      - name: Conferir se o site respondeu
        if: steps.servidor.outputs.pronto == 'true'
        run: |
          curl -fsS --retry 12 --retry-delay 5 --retry-all-errors "$SITE_URL/api/health"
          curl -fsS --retry 6 --retry-delay 5 --retry-all-errors -o /dev/null "$SITE_URL/"
          curl -fsS --retry 6 --retry-delay 5 --retry-all-errors -o /dev/null "$SITE_URL/mf/presentes/mf-manifest.json"
