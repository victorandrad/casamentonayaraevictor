# Monitor: a cada 5 minutos (o GitHub às vezes atrasa alguns minutos) confere de fora se o site está no ar.
#
#   site      a home responde e é a página do casamento
#   api       /api/health responde ok (ele também consulta o PostgreSQL)
#   remotes   o mf-manifest.json de cada micro-frontend é JSON de verdade (não o index.html de fallback)
#   https     o certificado ainda vale por mais de 10 dias (o Traefik renova; se falhar, avisa antes)
#
# Cada endereço tem 3 tentativas com 20 s entre elas, para um soluço de rede não virar alarme.
# Caiu: abre uma issue "[monitor] Site fora do ar" atribuída ao dono do repositório — o GitHub manda
# e-mail e push no app do celular. Enquanto continuar fora, não abre outra. Voltou: comenta e fecha.
name: Monitor

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

concurrency:
  group: monitor
  cancel-in-progress: false

permissions:
  issues: write

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SITE_URL: https://casamentonayaraevictor.com.br
      TITULO: '[monitor] Site fora do ar'
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TZ: America/Sao_Paulo
    steps:
      - name: Conferir site, API e micro-frontends
        id: checar
        run: |
          falhas=()

          # checar <nome> <caminho> <texto no corpo | tipo:content-type>
          checar() {
            local nome=$1 url="$SITE_URL$2" esperado=$3 codigo tipo corpo ok
            for tentativa in 1 2 3; do
              corpo=$(curl -sS --max-time 20 -o - -w '\n%{http_code} %{content_type}' "$url" 2>&1) || true
              codigo=$(tail -n1 <<<"$corpo" | cut -d' ' -f1)
              tipo=$(tail -n1 <<<"$corpo" | cut -d' ' -f2-)
              if [[ $esperado == tipo:* ]]; then [[ $tipo == "${esperado#tipo:}"* ]] && ok=1 || ok=0
              else grep -qF -- "$esperado" <<<"$corpo" && ok=1 || ok=0; fi
              if [ "$codigo" = 200 ] && [ $ok = 1 ]; then
                echo "ok    $nome"
                return
              fi
              [ $tentativa -lt 3 ] && sleep 20
            done
            motivo="HTTP ${codigo:-sem resposta}"
            [ "$codigo" = 200 ] && motivo="respondeu, mas não com o conteúdo esperado"
            echo "FALHA $nome ($url → $motivo)"
            falhas+=("$nome: $motivo em $url")
          }

          checar site / '<title>Nayara & Victor'
          checar api /api/health '"ok":true'
          for remote in evento rsvp presentes mural painel; do
            checar "remote $remote" "/mf/$remote/mf-manifest.json" tipo:application/json
          done

          host=${SITE_URL#https://}
          validade=$(echo | openssl s_client -servername "$host" -connect "$host:443" 2>/dev/null | openssl x509 -noout -enddate | cut -d= -f2)
          if [ -z "$validade" ]; then
            falhas+=("https: não consegui ler o certificado")
          else
            dias=$(( ($(date -d "$validade" +%s) - $(date +%s)) / 86400 ))
            echo "https certificado vale por mais $dias dias"
            [ "$dias" -lt 10 ] && falhas+=("https: o certificado vence em $dias dias ($validade)")
          fi

          {
            echo 'falhas<<FIM'
            printf -- '- %s\n' "${falhas[@]}"
            echo FIM
          } >>"$GITHUB_OUTPUT"
          echo "total=${#falhas[@]}" >>"$GITHUB_OUTPUT"

      - name: Abrir ou fechar o aviso
        env:
          TOTAL: ${{ steps.checar.outputs.total }}
          FALHAS: ${{ steps.checar.outputs.falhas }}
          EXECUCAO: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          aberta=$(gh issue list --state open --json number,title --jq "map(select(.title == env.TITULO)) | .[0].number // empty")
          agora=$(date '+%d/%m/%Y %H:%M')

          if [ "$TOTAL" -gt 0 ]; then
            if [ -z "$aberta" ]; then
              gh issue create --title "$TITULO" --assignee "${{ github.repository_owner }}" --body "$(printf 'Desde %s (horário de Brasília) o monitor não conseguiu acessar:\n\n%s\n\nExecução: %s\n\nA issue fecha sozinha quando tudo voltar a responder.' "$agora" "$FALHAS" "$EXECUCAO")"
            else
              echo "Continua fora; aviso #$aberta já está aberto."
            fi
          elif [ -n "$aberta" ]; then
            gh issue close "$aberta" --comment "Voltou ao ar: em $agora tudo respondeu normalmente."
          fi
