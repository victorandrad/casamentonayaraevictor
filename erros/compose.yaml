# Monitoramento de erros do frontend (https://erros.casamentonayaraevictor.com.br), com o GlitchTip
# (open source, MIT; recebe os erros pelo SDK do Sentry). Roda no VPS em /opt/erros, fora do compose do
# site, com banco próprio: se o site cair, os erros continuam guardados e visíveis.
#
#   scp erros/compose.yaml root@177.7.36.12:/opt/erros/
#   ssh root@177.7.36.12 'cd /opt/erros && docker compose up -d'
#
# A chave do Django e a senha do banco ficam em /opt/erros/.env (SECRET_KEY=... e BANCO_SENHA=...),
# criadas uma vez no servidor com `openssl rand -hex 32` e nunca versionadas. Sem Valkey (VALKEY_URL vazio): fila, cache e sessões
# ficam no próprio Postgres, que basta para o volume de um site de casamento.
#
# Fica na 6.2 de propósito: a 7.0 exige migrar pela 6.2.6 e mudou o modo de rodar tudo num container.
x-ambiente: &ambiente
  DATABASE_URL: postgres://glitchtip:${BANCO_SENHA:?defina BANCO_SENHA em /opt/erros/.env}@banco:5432/glitchtip
  VALKEY_URL: ""
  SECRET_KEY: ${SECRET_KEY:?defina SECRET_KEY em /opt/erros/.env}
  GLITCHTIP_DOMAIN: https://erros.casamentonayaraevictor.com.br
  GLITCHTIP_INSTANCE_NAME: Erros · Nayara & Victor
  # Alertas por e-mail saem pelo servidor de e-mail compartilhado (rede "email", sem login).
  EMAIL_URL: smtp://mail.casamentonayaraevictor.com.br:25
  DEFAULT_FROM_EMAIL: Erros · Nayara & Victor <nao-responder@casamentonayaraevictor.com.br>
  # Depois da primeira conta (a dos noivos), ninguém mais se cadastra.
  ENABLE_USER_REGISTRATION: "False"
  ENABLE_ORGANIZATION_CREATION: "False"
  # O que este uso não precisa: só os erros do navegador.
  GLITCHTIP_ENABLE_LOGS: "False"
  GLITCHTIP_ENABLE_UPTIME: "False"
  ENABLE_ADMIN: "False"
  GLITCHTIP_MAX_EVENT_LIFE_DAYS: "90"
  SERVER_ROLE: all_in_one
  PORT: "8000"

services:
  banco:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: glitchtip
      POSTGRES_PASSWORD: ${BANCO_SENHA}
      POSTGRES_DB: glitchtip
    volumes:
      - banco:/var/lib/postgresql/data
    mem_limit: 256m

  glitchtip:
    image: glitchtip/glitchtip:6.2.6
    restart: unless-stopped
    depends_on:
      - banco
    environment: *ambiente
    volumes:
      - uploads:/code/uploads
    networks:
      - default
      - email
    mem_limit: 512m
    labels:
      traefik.enable: "true"
      traefik.docker.network: erros_default
      traefik.http.routers.erros.rule: Host(`erros.casamentonayaraevictor.com.br`)
      traefik.http.routers.erros.entrypoints: websecure
      traefik.http.routers.erros.tls.certresolver: letsencrypt
      traefik.http.services.erros.loadbalancer.server.port: "8000"

volumes:
  banco:
  uploads:

networks:
  email:
    external: true
