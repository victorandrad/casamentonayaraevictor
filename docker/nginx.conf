# Serve o shell, os microfrontends e repassa a API — tudo na mesma origem.
#   /           shell (qualquer rota, como /painel, cai no index.html)
#   /mf/<app>/  cada microfrontend (evento, rsvp, presentes, mural, painel)
#   /api/       container da API
# Em produção fica atrás do Traefik, que cuida do HTTPS.

# Política de segurança de conteúdo: só rodam scripts do próprio site e do Mercado Pago (formulário
# de pagamento, antifraude); o mapa e as fontes vêm do Google. Por enquanto em modo relatório: o
# navegador não bloqueia nada, só avisa a API (/api/csp-relatorio, visto no painel) do que bloquearia.
# Quando os avisos mostrarem só coisas estranhas, troque Content-Security-Policy-Report-Only por
# Content-Security-Policy nos dois add_header abaixo. Atenção: o antifraude do Mercado Pago
# (security.js) injeta scripts inline com conteúdo que muda a cada visita (não dá para liberar por
# hash). Ao bloquear de verdade, ou se aceita 'unsafe-inline' em script-src, ou essa parte do
# antifraude deixa de rodar (o pagamento em si continua funcionando).
map $host $csp {
  default "default-src 'self'; script-src 'self' https://sdk.mercadopago.com https://*.mercadopago.com https://*.mercadolibre.com https://*.mlstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://*.mlstatic.com; font-src 'self' data: https://fonts.gstatic.com https://*.mlstatic.com; img-src 'self' data: blob: https:; connect-src 'self' https://*.mercadopago.com https://*.mercadolibre.com https://*.mlstatic.com; frame-src https://*.mercadopago.com https://*.mercadolibre.com https://www.google.com https://maps.google.com; worker-src 'self' blob:; media-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self' https://*.mercadopago.com; frame-ancestors 'none'; report-uri /api/csp-relatorio";
}

# Atrás do Traefik o esquema real vem no X-Forwarded-Proto.
map $http_x_forwarded_proto $proto {
  default $http_x_forwarded_proto;
  ''      $scheme;
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  server_tokens off;

  gzip on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_types text/css application/javascript text/javascript application/json image/svg+xml application/manifest+json;

  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  # O site nunca aparece dentro de outro (clickjacking: enganar o convidado a clicar em "Pagar").
  add_header X-Frame-Options "DENY" always;
  # Câmera só para o próprio site (leitor de QR do check-in); microfone e localização, ninguém.
  add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(), payment=(self)" always;
  add_header Content-Security-Policy-Report-Only $csp always;

  # DNS interno do Docker, consultado de novo a cada 10 s: no deploy só do backend o container da API
  # é recriado (pode mudar de IP) e este Nginx não reinicia. proxy_pass com variável faz o Nginx
  # resolver "api" na hora, em vez de guardar o IP da inicialização.
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $api http://api:4100;

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  # ---- API ----

  # ^~: nenhuma regex abaixo pode capturar uma rota da API.
  location ^~ /api/ {
    proxy_pass $api;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $proto;
    # Fotos dos presentes (a API aceita até 10 MB)
    client_max_body_size 12m;
  }

  # ---- Microfrontends (Module Federation) ----

  # Manifest de cada remoto: sempre revalidar, senão o shell carrega versão velha após deploy.
  location ~ ^/mf/[^/]+/mf-manifest\.json$ {
    add_header Cache-Control "no-cache" always;
    try_files $uri =404;
  }

  # Arquivos com hash no nome (Rsbuild): cache longo.
  location ~ ^/(mf/[^/]+/)?static/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  location /mf/ {
    try_files $uri =404;
  }

  # O mime.types do Nginx não conhece a extensão do manifest do app.
  location = /site.webmanifest {
    default_type application/manifest+json;
    try_files $uri =404;
  }

  # ---- Shell (SPA) ----

  location / {
    # Um add_header aqui anula os do server: os de segurança se repetem.
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(), payment=(self)" always;
    add_header Content-Security-Policy-Report-Only $csp always;
    try_files $uri $uri/ /index.html;
  }
}
