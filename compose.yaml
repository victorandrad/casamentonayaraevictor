# Site do casamento em containers.
#
#   docker compose up -d --build                  → banco, API e Mailpit (os front-ends rodam no npm run dev)
#
# O servidor de e-mail de produção é outro projeto Docker (atende vários domínios); a API só edita
# as caixas deste domínio na pasta de configuração dele.
#   docker compose --profile site up -d --build   → + o site completo no Nginx: http://localhost:8088
#   docker compose --profile stripe up -d         → + Stripe CLI repassando os webhooks de teste
#
# Produção (VPS): este arquivo + compose.producao.yaml (veja a seção Deploy do README).
name: casamento-nv

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-casamento}
      POSTGRES_USER: ${POSTGRES_USER:-casamento}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 4100
      DATABASE_URL: postgres://${POSTGRES_USER:-casamento}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-casamento}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:4000}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_NOME: ${ADMIN_NOME:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      SITE_URL: ${SITE_URL:-http://localhost:4000}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      # E-mail (receipts). Defaults point to the local Mailpit server below.
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      EMAIL_FROM: ${EMAIL_FROM:-Nayara & Victor <nao-responder@nayaraevictor.local>}
      EMAIL_REPLY_TO: ${EMAIL_REPLY_TO:-}
      # Mailboxes of this domain managed from the panel. The mail server itself lives in another
      # Docker project (it serves several domains); the API only edits its config folder.
      MAIL_DOMAIN: ${MAIL_DOMAIN:-casamento.localhost}
      MAIL_CONFIG_DIR: /mail-config
    ports:
      - "${API_PORT:-4100}:4100"
    volumes:
      - uploads-data:/app/uploads
      # Config folder of the mail server (postfix-accounts.cf / postfix-virtual.cf). Locally an
      # empty volume; on the server, the folder of the mail server's project (MAIL_CONFIG_PATH).
      - ${MAIL_CONFIG_PATH:-mail-config}:/mail-config
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started

  # The whole site as in production: shell and microfrontends built into Nginx,
  # which also forwards /api. Built locally here; production pulls the image
  # built by the Frontend workflow (docker/web.dist.Dockerfile).
  web:
    profiles: ["site"]
    build:
      context: .
      dockerfile: docker/web.Dockerfile
      args:
        SITE_URL: http://localhost:${WEB_PORT:-8088}
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8088}:80"
    depends_on:
      api:
        condition: service_healthy

  # Own mail server for development: receives every e-mail the API sends and
  # shows it at http://localhost:8025 (nothing leaves the machine).
  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    environment:
      MP_MAX_MESSAGES: 500
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    ports:
      - "${MAILPIT_UI_PORT:-8025}:8025"
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
    volumes:
      - mail-data:/data

  # Local only: forwards Stripe test events to the API.
  #   docker compose --profile stripe up -d stripe-cli
  #   docker compose logs stripe-cli   → copy the whsec_… into STRIPE_WEBHOOK_SECRET
  stripe-cli:
    image: stripe/stripe-cli:latest
    profiles: ["stripe"]
    restart: unless-stopped
    command: >
      listen
      --latest
      --api-key ${STRIPE_SECRET_KEY:-}
      --forward-to http://api:4100/api/stripe/webhook
      --events checkout.session.completed,checkout.session.async_payment_succeeded,checkout.session.async_payment_failed,checkout.session.expired
    depends_on:
      - api

volumes:
  db-data:
  uploads-data:
  mail-data:
  mail-config:
