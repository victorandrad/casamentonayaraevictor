# Site do casamento em containers.
#
#   docker compose up -d --build                  → banco, API e Mailpit (os front-ends rodam no npm run dev)
#   docker compose --profile site up -d --build   → + o site completo no Nginx: http://localhost:8088
#   docker compose --profile stripe up -d         → + Stripe CLI repassando os webhooks de teste
#
# Produção (VPS): este arquivo + compose.producao.yaml (veja a seção Deploy do README).
name: casamento-nv

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-casamento}
      POSTGRES_USER: ${POSTGRES_USER:-casamento}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 4100
      DATABASE_URL: postgres://${POSTGRES_USER:-casamento}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-casamento}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:4000}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_NOME: ${ADMIN_NOME:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      SITE_URL: ${SITE_URL:-http://localhost:4000}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      # E-mail (receipts). Defaults point to the local Mailpit server below.
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      EMAIL_FROM: ${EMAIL_FROM:-Nayara & Victor <presentes@nayaraevictor.local>}
      EMAIL_REPLY_TO: ${EMAIL_REPLY_TO:-}
      # Mailboxes managed from the panel (shared with the mailserver service)
      MAIL_DOMAIN: ${MAIL_DOMAIN:-casamento.localhost}
      MAIL_CONFIG_DIR: /mail-config
    ports:
      - "${API_PORT:-4100}:4100"
    volumes:
      - uploads-data:/app/uploads
      - mail-config:/mail-config
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started

  # The whole site as in production: shell and microfrontends built into Nginx,
  # which also forwards /api. Built locally here; production pulls the image
  # built by the Frontend workflow (docker/web.dist.Dockerfile).
  web:
    profiles: ["site"]
    build:
      context: .
      dockerfile: docker/web.Dockerfile
      args:
        SITE_URL: http://localhost:${WEB_PORT:-8088}
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8088}:80"
    depends_on:
      api:
        condition: service_healthy

  # Own mail server for development: receives every e-mail the API sends and
  # shows it at http://localhost:8025 (nothing leaves the machine).
  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    environment:
      MP_MAX_MESSAGES: 500
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    ports:
      - "${MAILPIT_UI_PORT:-8025}:8025"
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
    volumes:
      - mail-data:/data

  # Own mail server (Postfix + Dovecot + Rspamd/DKIM). Mailboxes and aliases are managed in the
  # couple's panel (E-mails tab): the API writes postfix-accounts.cf / postfix-virtual.cf in the
  # shared mail-config volume and the server reloads them by itself. Off locally unless asked:
  #   docker compose --profile email up -d mailserver webmail
  mailserver:
    image: ghcr.io/docker-mailserver/docker-mailserver:16.0.1
    profiles: ["email"]
    hostname: ${MAIL_HOSTNAME:-mail.casamento.localhost}
    restart: unless-stopped
    environment:
      ENABLE_RSPAMD: 1
      ENABLE_OPENDKIM: 0
      ENABLE_OPENDMARC: 0
      ENABLE_POLICYD_SPF: 0
      ENABLE_AMAVIS: 0
      ENABLE_CLAMAV: 0
      ENABLE_FAIL2BAN: 1
      # Containers of this project (the API) may send without logging in.
      PERMIT_DOCKER: connected-networks
      SSL_TYPE: ${MAIL_SSL_TYPE:-}
      TZ: America/Sao_Paulo
    ports:
      - "${MAIL_SMTP_PORT:-2525}:25"
      - "${MAIL_SUBMISSION_PORT:-2587}:587"
      - "${MAIL_SUBMISSIONS_PORT:-2465}:465"
      - "${MAIL_IMAPS_PORT:-2993}:993"
    volumes:
      - mail-config:/tmp/docker-mailserver
      - mail-server-data:/var/mail
      - mail-server-state:/var/mail-state
      - mail-server-logs:/var/log/mail
    cap_add:
      - NET_ADMIN
    healthcheck:
      test: "ss --listening --tcp | grep -P 'LISTEN.+:smtp' || exit 1"
      interval: 15s
      timeout: 3s
      retries: 0

  # Webmail (Roundcube) for reading and answering the mailboxes in the browser.
  webmail:
    image: roundcube/roundcubemail:1.7.5-apache
    profiles: ["email"]
    restart: unless-stopped
    environment:
      ROUNDCUBEMAIL_DEFAULT_HOST: ${MAIL_IMAP_HOST:-mailserver}
      ROUNDCUBEMAIL_DEFAULT_PORT: ${MAIL_IMAP_PORT:-143}
      ROUNDCUBEMAIL_SMTP_SERVER: ${MAIL_SMTP_HOST:-mailserver}
      ROUNDCUBEMAIL_SMTP_PORT: ${MAIL_WEBMAIL_SMTP_PORT:-25}
      ROUNDCUBEMAIL_DB_TYPE: sqlite
      ROUNDCUBEMAIL_SKIN: elastic
      ROUNDCUBEMAIL_UPLOAD_MAX_FILESIZE: 20M
      ROUNDCUBEMAIL_PLUGINS: archive,zipdownload,managesieve,markasjunk
    ports:
      - "${WEBMAIL_PORT:-8089}:80"
    volumes:
      - webmail-data:/var/roundcube/db
    depends_on:
      - mailserver

  # Local only: forwards Stripe test events to the API.
  #   docker compose --profile stripe up -d stripe-cli
  #   docker compose logs stripe-cli   → copy the whsec_… into STRIPE_WEBHOOK_SECRET
  stripe-cli:
    image: stripe/stripe-cli:latest
    profiles: ["stripe"]
    restart: unless-stopped
    command: >
      listen
      --latest
      --api-key ${STRIPE_SECRET_KEY:-}
      --forward-to http://api:4100/api/stripe/webhook
      --events checkout.session.completed,checkout.session.async_payment_succeeded,checkout.session.async_payment_failed,checkout.session.expired
    depends_on:
      - api

volumes:
  db-data:
  uploads-data:
  mail-data:
  mail-config:
  mail-server-data:
  mail-server-state:
  mail-server-logs:
  webmail-data:
